title: Temporal in Practice - Python
teaser: Eight hands-on Python exercises. Write the Workflows, Activities, Signals,
  Queries, tests and version patches yourself.
description: |-
  A hands-on Temporal workshop in Python. Every challenge hands you a file
  full of TODOs and a Temporal dev server that is already running.

  Start with a Workflow that returns a greeting. Finish with a money
  transfer Workflow that takes a Signal for approval, answers Queries about
  its state, carries a search attribute, retries a bad Activity on demand,
  and gets versioned with the Patched API without breaking the histories
  already on disk.

  The Solution tab has the finished code for every exercise. Use it when
  you get stuck, not before.
